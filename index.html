<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;

  background:
    linear-gradient(
      135deg,
      #fde7f0,
      #eadcf8
    );

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
}


/* =========================
   MAIN CARD
========================= */

.card {

  width: calc(100% - 36px);
  max-width: 640px;

  min-height: 620px;

  background: rgba(255,255,255,0.94);

  border-radius: 42px;

  padding: 70px 35px;

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;

  box-shadow:
    0 25px 70px rgba(70, 30, 60, 0.15);
}


/* =========================
   SLIDES
========================= */

.slide {
  display: none;
  width: 100%;
}

.slide.active {
  display: block;
}


/* =========================
   EYES
========================= */

.eyes {
  font-size: 58px;
  margin-bottom: 25px;
}


/* =========================
   HEADINGS
========================= */

h1 {

  margin: 0 auto 25px;

  max-width: 520px;

  font-size: clamp(42px, 7vw, 64px);

  line-height: 1.08;

  color: #211c23;

  font-weight: 700;
}


/* =========================
   SUBTEXT
========================= */

.subtitle {

  font-size: 28px;

  line-height: 1.4;

  color: #766b75;

  margin-bottom: 42px;
}


/* =========================
   BUTTON
========================= */

button {

  border: none;

  background: #211c23;

  color: white;

  font-size: 22px;

  padding: 20px 38px;

  border-radius: 50px;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

button:hover {

  transform: translateY(-3px);

  box-shadow:
    0 12px 25px rgba(33,28,35,0.2);
}

button:active {

  transform: scale(0.96);
}


/* =========================
   REVEAL
========================= */

.reveal {

  display: none;

  font-size: 34px;

  font-weight: 700;

  color: #211c23;

  margin: 30px 0;
}


/* =========================
   YES / NO BUTTONS
========================= */

.answer-buttons {

  display: flex;

  justify-content: center;

  gap: 18px;

  flex-wrap: wrap;
}

.answer-buttons button {

  min-width: 130px;
}

.yes {

  background: #211c23;
}

.no {

  background: #eee8ed;

  color: #211c23;
}


/* =========================
   RESULTS
========================= */

.result {

  display: none;

  margin-top: 35px;

  font-size: 27px;

  line-height: 1.4;

  color: #211c23;
}


/* =========================
   SPARKS
========================= */

.spark {

  position: fixed;

  top: -40px;

  font-size: 30px;

  pointer-events: none;

  animation:
    fall 3.2s linear forwards;

  z-index: 9999;
}

@keyframes fall {

  0% {

    transform:
      translateY(0)
      rotate(0deg);

    opacity: 1;
  }

  100% {

    transform:
      translateY(110vh)
      rotate(360deg);

    opacity: 0;
  }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .card {

    min-height: 640px;

    padding:
      55px 24px;

    border-radius: 38px;
  }

  .eyes {

    font-size: 48px;
  }

  h1 {

    font-size: 42px;
  }

  .subtitle {

    font-size: 23px;
  }

  button {

    font-size: 20px;

    padding:
      18px 30px;
  }

  .reveal {

    font-size: 29px;
  }

  .result {

    font-size: 23px;
  }
}

</style>
</head>


<body>


<div class="card">


  <!-- =========================
       SLIDE 1
  ========================== -->

  <div
    class="slide active"
    id="slide1"
  >

    <div class="eyes">
      👀
    </div>

    <h1>
      Well tbh… I'm gonna give you a 9/10.
    </h1>

    <div class="subtitle">
      Don't ask why yet. 😌
    </div>

    <button
      onclick="nextSlide()"
    >
      Why not 10? →
    </button>

  </div>



  <!-- =========================
       SLIDE 2
  ========================== -->

  <div
    class="slide"
    id="slide2"
  >

    <div class="eyes">
      👀
    </div>

    <h1>
      Because… I'm leaving that 1 point for someone.
    </h1>

    <button
      onclick="reveal()"
    >
      Wait… who? 👀
    </button>


    <div
      class="reveal"
      id="reveal"
    >
      Me. I'm the 1 you need. 😉
    </div>


    <button
      id="nextButton"
      onclick="goNext()"
      style="display:none;"
    >
      Okay… what's next? →
    </button>

  </div>



  <!-- =========================
       SLIDE 3
  ========================== -->

  <div
    class="slide"
    id="slide3"
  >

    <div class="eyes">
      🫣
    </div>

    <h1>
      So… should we fix that missing 1? 😏
    </h1>


    <div class="answer-buttons">

      <button
        class="yes"
        onclick="answer(true)"
      >
        Yes ❤️
      </button>


      <button
        class="no"
        onclick="answer(false)"
      >
        No 😌
      </button>

    </div>


    <div
      class="result"
      id="yesResult"
    >
      Then I guess we're getting coffee. ☕❤️
    </div>


    <div
      class="result"
      id="noResult"
    >
      Fair enough… 😌
    </div>

  </div>


</div>



<script>


// ==================================================
// GOOGLE SHEETS TRACKING URL
// ==================================================

const TRACKING_URL =
"https://script.google.com/macros/s/AKfycbwBLNXoBewpRakYX9uM7gR9r_9GT6QxyHVB_5ZNG3M4qo5sdqWeoealIP2g21wk8cMH0A/exec";


// ==================================================
// GET PERSON / LINK ID
// ==================================================

const params =
  new URLSearchParams(
    window.location.search
  );

const personId =
  params.get("id") || "unknown";


// ==================================================
// TRACKING FUNCTION
// ==================================================

function track(event, detail) {

  const data = {

    id: personId,

    event: event,

    detail: detail || "",

    page: window.location.href,

    timestamp:
      new Date().toISOString()

  };


  fetch(TRACKING_URL, {

    method: "POST",

    mode: "no-cors",

    headers: {

      "Content-Type":
        "text/plain;charset=utf-8"

    },

    body:
      JSON.stringify(data),

    keepalive: true

  }).catch(function () {});

}


// ==================================================
// SHOW SLIDE
// ==================================================

function showSlide(number) {

  const slides =
    document.querySelectorAll(".slide");


  slides.forEach(function(slide) {

    slide.classList.remove("active");

  });


  const selected =
    document.getElementById(
      "slide" + number
    );


  if (selected) {

    selected.classList.add("active");

  }


  // Track slide views

  if (number === 2) {

    track(
      "slide_view",
      "Slide 2"
    );

  }


  if (number === 3) {

    track(
      "slide_view",
      "Slide 3"
    );

  }

}


// ==================================================
// SLIDE 1 → SLIDE 2
// ==================================================

function nextSlide() {

  track(
    "click",
    "Why not 10?"
  );


  showSlide(2);

}


// ==================================================
// REVEAL SLIDE 2
// ==================================================

function reveal() {

  track(
    "click",
    "Wait… who? 👀"
  );


  const revealText =
    document.getElementById(
      "reveal"
    );


  if (revealText) {

    revealText.style.display =
      "block";

  }


  const nextButton =
    document.getElementById(
      "nextButton"
    );


  if (nextButton) {

    nextButton.style.display =
      "inline-block";

  }

}


// ==================================================
// SLIDE 2 → SLIDE 3
// ==================================================

function goNext() {

  track(
    "click",
    "Okay… what's next?"
  );


  showSlide(3);

}


// ==================================================
// YES / NO ANSWER
// ==================================================

function answer(yes) {

  trackAnswer(yes);


  const yesResult =
    document.getElementById(
      "yesResult"
    );


  const noResult =
    document.getElementById(
      "noResult"
    );


  if (yesResult) {

    yesResult.style.display =
      yes
        ? "block"
        : "none";

  }


  if (noResult) {

    noResult.style.display =
      yes
        ? "none"
        : "block";

  }


  if (yes) {

    celebrate();

  }

}


// ==================================================
// TRACK YES / NO
// ==================================================

function trackAnswer(yes) {

  track(

    "answer",

    yes
      ? "YES 👀"
      : "NO 😌"

  );

}


// ==================================================
// YES ANIMATION
// ==================================================

function celebrate() {

  for (
    let i = 0;
    i < 22;
    i++
  ) {

    const spark =
      document.createElement("div");


    spark.className =
      "spark";


    spark.textContent = [

      "❤️",
      "✨",
      "💕",
      "💗",
      "💖"

    ][i % 5];


    spark.style.left =
      Math.random() * 100 + "vw";


    spark.style.animationDelay =
      Math.random() * 0.7 + "s";


    document.body.appendChild(
      spark
    );


    setTimeout(
      function() {

        spark.remove();

      },
      3200
    );

  }

}


// ==================================================
// TRACK PAGE OPEN
// ==================================================

track(

  "viewed",

  "Opened pickup page"

);


// ==================================================
// TRACK WHEN PAGE BECOMES INACTIVE
// ==================================================

document.addEventListener(

  "visibilitychange",

  function() {

    if (
      document.visibilityState ===
      "hidden"
    ) {

      track(

        "page_inactive",

        "Page became inactive"

      );

    }

  }

);


</script>


</body>
</html>
