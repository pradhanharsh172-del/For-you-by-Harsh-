<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>9/10 👀</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#fff1f5,#f5e9ff);
overflow:hidden;color:#241a22}.card{width:min(92vw,430px);padding:42px 28px;text-align:center;background:#ffffffd9;
backdrop-filter:blur(12px);border-radius:28px;box-shadow:0 20px 60px #8c547733}
h1{font-size:58px;margin:0 0 12px}.sub{font-size:18px;color:#765f6b}.reveal{opacity:0;transform:translateY(15px) scale(.96);
transition:.7s;margin-top:26px}.show .reveal{opacity:1;transform:none}.big{font-size:30px;font-weight:800}.heart{font-size:62px;
animation:pulse 1s infinite alternate}@keyframes pulse{to{transform:scale(1.12)}}button{margin-top:26px;border:0;padding:13px 22px;
border-radius:999px;background:#241a22;color:white;font-size:16px;cursor:pointer}.spark{position:fixed;font-size:22px;animation:fall 2.5s linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="card" id="card">
  <h1>9/10 👀</h1>
  <div class="sub">Okay… but there's a reason I didn't give you 10.</div>
  <button onclick="reveal()">Find out why →</button>
  <div class="reveal">
    <div class="heart">❤️</div>
    <div class="big">Because I’m the 1 you need. 😉</div>
    <p>Now the math makes sense.</p>
  </div>
</div>
<script>
function reveal(){
 document.getElementById('card').classList.add('show');
 for(let i=0;i<22;i++){
   const s=document.createElement('div'); s.className='spark'; s.textContent=['❤️','✨','💖','💕'][i%4];
   s.style.left=Math.random()*100+'vw'; s.style.animationDelay=Math.random()*.8+'s';
   document.body.appendChild(s); setTimeout(()=>s.remove(),3500);
 }
}
</script>
</body>
</html>
